name: Build IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - "build_playlist.py"
      - ".github/workflows/update-playlist.yml"

permissions:
  contents: write

concurrency:
  group: playlist-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist and capture result
        id: build
        shell: bash
        run: |
          set +e
          python build_playlist.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit output and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-report.json
          if [ -f playlist.m3u ]; then git add playlist.m3u; fi
          if git diff --cached --quiet; then
            echo "No output changes."
          else
            git commit -m "Refresh IPTV build output"
            git push
          fi

      - name: Enforce validation gate
        if: steps.build.outputs.exit_code != '0'
        run: |
          cat build-report.json
          echo "Playlist validation failed; previous valid playlist was not replaced."
          exit 1
